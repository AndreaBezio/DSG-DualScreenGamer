# Platforms a game can run on. `screens` is the original hardware's screen count.
# `libretro` names the libretro-database DAT (dump hashes -> No-Intro/Redump names -> libretro-thumbnails artwork).
# `igdb`, `screenscraper`, `retroachievements`, `launchbox`, `thegamesdb` and `aliases` let frontends name the
# platform their own way in API calls (`platform=igdb:24`, `platform=ra:5`, `platform=n3ds`…).
# Values for nds/3ds/gba/switch/ps2 match the CocoonFE platform files.
- id: gb
  name: Game Boy
  manufacturer: Nintendo
  kind: handheld
  igdb: 33
  retroachievements: [4]
  launchbox: Nintendo Game Boy
  libretro: { system: Nintendo - Game Boy, dat: no-intro }
