# Dual-screen hardware. `displays` lists each screen, top first; `profiles` are recommended emulator
# settings. Every value here comes from the pages listed in `sources` / `source_url`: add yours the same way.
- id: ayn-thor
  name: AYN Thor
  manufacturer: AYN
  os: android
  screens: 2
  chipset: Snapdragon 8 Gen 2 (Lite model Snapdragon 865)
  aliases: [thor]
  displays:
    - { role: top, width: 1920, height: 1080, diagonal_in: 6.0, panel: amoled, refresh_hz: 120 }
    - { role: bottom, width: 1240, height: 1080, diagonal_in: 3.92, panel: amoled, refresh_hz: 60, touch: true }
  sources:
    - https://www.androidauthority.com/ayn-thor-screen-size-3589297
    - https://www.pockettactics.com/ayn-thor-specs
  profiles:
    - emulator: azahar
      settings:
        - { name: "Settings › Layout › Second Display Screen Layout", value: Bottom Screen, note: Reload the game afterwards; later games keep it }
        - { name: Asynchronous Shader Compilation, value: "On", note: Avoids micro-stutter when new assets load }
        - { name: Screen Swap, value: Map to a physical button }
      source_url: https://droix.net/blogs/ayn-thor-dual-screen-gaming-handheld/
    - emulator: melonds
      note: Needs the community dual-screen fork of melonDS; the official app has no dual-screen support.
      settings:
        - { name: "Video › Dual Screen Presets", value: "Internal: Top, External: Bottom", note: "On the Thor the top screen is the primary display" }
      source_url: https://retrogamecorps.com/category/3ds
