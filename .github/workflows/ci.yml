name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dsg
          POSTGRES_PASSWORD: dsg
          POSTGRES_DB: dsg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dsg" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://dsg:dsg@localhost:5432/dsg_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate registry
        run: pnpm registry:validate -- --remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @dsg/web build
